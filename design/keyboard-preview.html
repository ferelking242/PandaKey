<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PandaKey — Samsung Keyboard Preview</title>
<style>
:root {
  /* Samsung exact colors from screenshot */
  --bg: #0D0D0D;
  --key-bg: #2A2A2A;
  --key-border: #383838;
  --key-pressed: #484848;
  --key-action-bg: #1A1A1A;
  --label: #EAEAEA;
  --label-dim: #888888;
  --sublabel: #6E6E6E;
  --accent-blue: #4A90D9;
  --accent-green: #30D158;
  --toolbar-bg: #0D0D0D;
  --suggestion-bg: #0D0D0D;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #000;
  font-family: 'Roboto', -apple-system, sans-serif;
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
  touch-action: manipulation;
}

/* ═══ Keyboard ═══ */
.keyboard {
  background: var(--bg);
  user-select: none;
  flex-shrink: 0;
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0);
}

/* ─── Toolbar (6 icons) ─── */
.toolbar {
  display: flex; align-items: center; justify-content: space-around;
  height: 44px; padding: 0 4px;
  background: var(--toolbar-bg);
  border-bottom: 0.5px solid #1A1A1A;
}
.tb-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 8px;
  color: #98989D;
  font-size: 17px;
  cursor: pointer;
  position: relative;
}
.tb-icon:active { background: #2A2A2A; }
.tb-icon.active { color: var(--accent-blue); }
.tb-icon .dot {
  position: absolute; top: 4px; right: 4px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #FF9500;
}

/* ─── Key Row ─── */
.key-row {
  display: flex; justify-content: center;
  gap: 5px; padding: 3px 4px;
}

/* ─── Key ─── */
.key {
  height: 46px; min-width: 0; flex: 1; max-width: 38px;
  background: var(--key-bg);
  border: 0.8px solid var(--key-border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: var(--label);
  font-size: 22px; font-weight: 400;
  cursor: pointer;
  position: relative;
  transition: background 0.05s, transform 0.05s;
  will-change: transform;
}
.key:active, .key.pressed {
  background: var(--key-pressed);
  transform: scale(0.93);
}

/* Number row - same size as letters, same bg */
.number-row .key {
  height: 46px;
  font-size: 22px;
  background: var(--key-bg);
  border: 0.8px solid var(--key-border);
}
.number-row .key:active { background: var(--key-pressed); }

/* Action keys (transparent bg) */
.key.action-key {
  background: transparent;
  border: none;
  color: #98989D;
  font-size: 18px;
}
.key.action-key:active { background: #2A2A2A; }

/* Wide key */
.key.wide { flex: 1.5; max-width: 54px; }

/* Space bar */
.key.space {
  flex: 5; max-width: none;
  background: var(--key-bg);
  border: 0.8px solid var(--key-border);
  font-size: 13px;
  gap: 4px;
}
.key.space .space-label { color: var(--label-dim); letter-spacing: 0.3px; }
.key.space .mic-icon { font-size: 12px; color: #666; margin-left: 2px; }

/* Shift */
.key.shift-key {
  font-size: 18px;
  background: transparent;
  border: none;
  color: #98989D;
  max-width: 48px;
}
.key.shift-key:active { background: #2A2A2A; }
.key.shift-key.locked { background: var(--accent-blue); color: #fff; border: none; }

/* Backspace */
.key.backspace-key {
  background: transparent;
  border: none;
  color: #98989D;
  font-size: 18px;
  max-width: 48px;
}
.key.backspace-key:active { background: #2A2A2A; }

/* Enter/Search */
.key.enter-key {
  background: transparent;
  border: none;
  color: var(--accent-blue);
  font-size: 20px;
  max-width: 48px;
}
.key.enter-key:active { background: rgba(74,144,217,0.12); }

/* ─── Candidate strip ─── */
.candidate-strip {
  display: flex; align-items: center;
  height: 44px; padding: 0 6px; gap: 0;
  background: var(--suggestion-bg);
  border-bottom: 0.5px solid #1A1A1A;
}
.c-collapse {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  color: #98989D; font-size: 16px;
  cursor: pointer; flex-shrink: 0; border-radius: 6px;
}
.c-collapse:active { background: #2A2A2A; }
.c-word {
  flex: 1; text-align: center;
  color: var(--label); font-size: 15px;
  padding: 8px 4px; border-radius: 8px;
  cursor: pointer; white-space: nowrap;
}
.c-word:active { background: #2A2A2A; }
.c-more {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  color: #98989D; font-size: 18px;
  cursor: pointer; flex-shrink: 0; border-radius: 6px;
}
.c-more:active { background: #2A2A2A; }

/* ─── Modifier bar ─── */
.mod-bar {
  display: none; align-items: center; justify-content: center;
  height: 28px; font-size: 12px; font-weight: 600; letter-spacing: 1px;
}
.mod-bar.ctrl { display: flex; background: rgba(48,209,88,0.12); color: var(--accent-green); }
.mod-bar.shift { display: flex; background: rgba(74,144,217,0.12); color: var(--accent-blue); }

/* ─── Paste bar ─── */
.paste-bar {
  display: none; align-items: center;
  height: 42px; padding: 0 12px;
  background: var(--bg); gap: 8px;
}
.paste-bar.visible { display: flex; }
.paste-bar .paste-text { flex: 1; color: var(--label); font-size: 14px; }
.paste-bar .paste-close { color: #98989D; font-size: 18px; cursor: pointer; }

/* ─── Touch ripple ─── */
@keyframes ripple {
  0% { transform: scale(0); opacity: 0.3; }
  100% { transform: scale(2.5); opacity: 0; }
}
.ripple {
  position: absolute; width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.12); pointer-events: none;
  animation: ripple 0.25s ease-out forwards;
}
</style>
</head>
<body>

<div class="keyboard" id="keyboard">

  <!-- Modifier bar -->
  <div class="mod-bar" id="modBar"></div>

  <!-- Paste bar -->
  <div class="paste-bar" id="pasteBar">
    <span class="paste-text">Coller</span>
    <span class="paste-close" onclick="document.getElementById('pasteBar').classList.remove('visible')">✕</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="tb-icon" title="Curseur">↔</div>
    <div class="tb-icon" title="Sélection">埞</div>
    <div class="tb-icon" title="Presse-papiers">📋</div>
    <div class="tb-icon" title="Traduire">🌐</div>
    <div class="tb-icon" title="Clavier">⌨</div>
    <div class="tb-icon" title="Plus">⋯<span class="dot"></span></div>
  </div>

  <!-- Candidate strip -->
  <div class="candidate-strip" id="candidates">
    <div class="c-collapse">⌨</div>
    <div class="c-word" onclick="pickWord(this)">Bonjour</div>
    <div class="c-word" onclick="pickWord(this)">Bonsoir</div>
    <div class="c-word" onclick="pickWord(this)">Merci</div>
    <div class="c-more">⋯</div>
  </div>

  <!-- Number row -->
  <div class="key-row number-row" id="numberRow">
    <div class="key" data-val="1">1</div>
    <div class="key" data-val="2">2</div>
    <div class="key" data-val="3">3</div>
    <div class="key" data-val="4">4</div>
    <div class="key" data-val="5">5</div>
    <div class="key" data-val="6">6</div>
    <div class="key" data-val="7">7</div>
    <div class="key" data-val="8">8</div>
    <div class="key" data-val="9">9</div>
    <div class="key" data-val="0">0</div>
  </div>

  <!-- Row 1: AZERTY -->
  <div class="key-row" id="row1">
    <div class="key" data-val="a">a</div>
    <div class="key" data-val="z">z</div>
    <div class="key" data-val="e">e</div>
    <div class="key" data-val="r">r</div>
    <div class="key" data-val="t">t</div>
    <div class="key" data-val="y">y</div>
    <div class="key" data-val="u">u</div>
    <div class="key" data-val="i">i</div>
    <div class="key" data-val="o">o</div>
    <div class="key" data-val="p">p</div>
  </div>

  <!-- Row 2 -->
  <div class="key-row" id="row2">
    <div class="key" data-val="q">q</div>
    <div class="key" data-val="s">s</div>
    <div class="key" data-val="d">d</div>
    <div class="key" data-val="f">f</div>
    <div class="key" data-val="g">g</div>
    <div class="key" data-val="h">h</div>
    <div class="key" data-val="j">j</div>
    <div class="key" data-val="k">k</div>
    <div class="key" data-val="l">l</div>
    <div class="key" data-val="m">m</div>
  </div>

  <!-- Row 3: Shift + letters + backspace -->
  <div class="key-row" id="row3">
    <div class="key shift-key" data-action="shift" id="shiftKey">⇧</div>
    <div class="key" data-val="w">w</div>
    <div class="key" data-val="x">x</div>
    <div class="key" data-val="c">c</div>
    <div class="key" data-val="v">v</div>
    <div class="key" data-val="b">b</div>
    <div class="key" data-val="n">n</div>
    <div class="key" data-val="'">'</div>
    <div class="key backspace-key" data-action="backspace">⌫</div>
  </div>

  <!-- Bottom row: !#1, 🌐, comma, space, period, search -->
  <div class="key-row" id="bottomRow">
    <div class="key wide action-key" data-action="symbols">!#1</div>
    <div class="key action-key" data-action="globe" id="globeKey">🌐</div>
    <div class="key action-key" data-val=",">,</div>
    <div class="key space" data-action="space">
      <span class="space-label" id="spaceLabel">Français (FR)</span>
      <span class="mic-icon">🎤</span>
    </div>
    <div class="key action-key" data-val=".">.</div>
    <div class="key enter-key" data-action="enter">🔍</div>
  </div>
</div>

<script>
const input = document.createElement('input');
input.type = 'text';
input.id = 'hiddenInput';
input.style.cssText = 'position:fixed;top:-999px;left:-999px;';
document.body.appendChild(input);

let shiftActive = false;
let ctrlActive = false;

const WORDS = {
  '': ['Bonjour','Bonsoir','Merci','Salut','Super','Ok'],
  'b': ['Bonjour','Bonsoir','Bon','Bien'],
  'f': ['F','Fix','For','Fait','Faire','First'],
  's': ['Salut','Super','Solution','Soon'],
  'j': ['Je','J\'ai','Jamais'],
  'm': ['Mais','Merci','Mon','Ma'],
  't': ['Tu','Tout','Très','Ton'],
};

function handleKey(el) {
  el.classList.add('pressed');
  const r = document.createElement('span');
  r.className = 'ripple';
  el.appendChild(r);
  setTimeout(() => r.remove(), 250);
  setTimeout(() => el.classList.remove('pressed'), 60);

  const val = el.dataset.val;
  const action = el.dataset.action;

  if (action === 'shift') {
    shiftActive = !shiftActive;
    updateShift();
    return;
  }
  if (action === 'backspace') {
    input.value = input.value.slice(0, -1);
    updateCandidates();
    return;
  }
  if (action === 'space') {
    input.value += ' ';
    updateCandidates();
    return;
  }
  if (action === 'enter') {
    alert('Search: ' + input.value);
    return;
  }
  if (action === 'globe') {
    const fr = document.getElementById('spaceLabel').textContent === 'Français (FR)';
    document.getElementById('spaceLabel').textContent = fr ? 'English (US)' : 'Français (FR)';
    return;
  }
  if (action === 'symbols') {
    toggleSymbols();
    return;
  }

  if (val) {
    const ch = shiftActive ? val.toUpperCase() : val;
    input.value += ch;
    if (shiftActive && !el.closest('.number-row')) {
      shiftActive = false;
      updateShift();
    }
    updateCandidates();
  }
}

function updateShift() {
  document.querySelectorAll('#row1 .key, #row2 .key, #row3 .key[data-val]').forEach(k => {
    k.textContent = shiftActive ? k.dataset.val.toUpperCase() : k.dataset.val;
  });
  document.getElementById('shiftKey').classList.toggle('locked', shiftActive);
}

function updateCandidates() {
  const strip = document.getElementById('candidates');
  const last = input.value.split(/[\s]/).pop().toLowerCase();
  const sugs = WORDS[last] || WORDS[''];
  strip.innerHTML = `
    <div class="c-collapse">⌨</div>
    ${sugs.slice(0,3).map(w => `<div class="c-word" onclick="pickWord(this)">${w}</div>`).join('')}
    <div class="c-more">⋯</div>
  `;
}

function pickWord(el) {
  const words = input.value.split(/(\s)/);
  for (let i = words.length - 1; i >= 0; i--) {
    if (words[i].trim()) { words[i] = el.textContent + ' '; break; }
  }
  input.value = words.join('');
  updateCandidates();
}

let symPage = 1;
const SYM = [
  [['+','×','÷','=','/','_','<','>','[',']'],['!','@','#','€','%','^','&','*','(',')']],
  [['`','~','\\','|','{','}','$','£','¥','₩'],['°','•','○','●','□','■','♤','♡','♢','♧']]
];

function toggleSymbols() {
  if (document.getElementById('row1').querySelector('[data-val="a"]')) {
    // Show symbols
    const page = SYM[symPage - 1];
    document.getElementById('row1').innerHTML = page[0].map(s => `<div class="key" data-val="${s}">${s}</div>`).join('');
    document.getElementById('row2').innerHTML = page[1].map(s => `<div class="key" data-val="${s}">${s}</div>`).join('');
    document.getElementById('row3').innerHTML = `
      <div class="key wide action-key" data-action="symbols">${symPage}/2</div>
      <div class="key" data-val="-">-</div>
      <div class="key" data-val="'">'</div>
      <div class="key" data-val='"'>"'</div>
      <div class="key" data-val=":">:</div>
      <div class="key" data-val=";">;</div>
      <div class="key" data-val=",">,</div>
      <div class="key" data-val="?">?</div>
      <div class="key backspace-key" data-action="backspace">⌫</div>
    `;
    document.querySelector('#bottomRow [data-action="symbols"]').textContent = 'ABC';
    document.querySelector('#bottomRow [data-action="symbols"]').dataset.action = 'backToAbc';
  } else {
    // Back to ABC
    document.getElementById('row1').innerHTML = 'azertyuiop'.split('').map(c => `<div class="key" data-val="${c}">${c}</div>`).join('');
    document.getElementById('row2').innerHTML = 'qsdfghjklm'.split('').map(c => `<div class="key" data-val="${c}">${c}</div>`).join('');
    document.getElementById('row3').innerHTML = `
      <div class="key shift-key" data-action="shift" id="shiftKey">⇧</div>
      <div class="key" data-val="w">w</div>
      <div class="key" data-val="x">x</div>
      <div class="key" data-val="c">c</div>
      <div class="key" data-val="v">v</div>
      <div class="key" data-val="b">b</div>
      <div class="key" data-val="n">n</div>
      <div class="key" data-val="'">'</div>
      <div class="key backspace-key" data-action="backspace">⌫</div>
    `;
    document.querySelector('#bottomRow [data-action="backToAbc"]').textContent = '!#1';
    document.querySelector('#bottomRow [data-action="backToAbc"]').dataset.action = 'symbols';
    updateShift();
  }
  bindKeys();
}

function bindKeys() {
  document.querySelectorAll('.key').forEach(el => {
    el.ontouchstart = (e) => { e.preventDefault(); handleKey(el); };
    el.onmousedown = (e) => { e.preventDefault(); handleKey(el); };
  });
}

bindKeys();
updateCandidates();
</script>
</body>
</html>
